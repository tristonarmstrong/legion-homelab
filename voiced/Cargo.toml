[package]
name = "voiced"
version = "0.1.0"
edition = "2024"
description = "Always-on voice loop: wake word -> Whisper -> Hermes -> tiny-voca"

[dependencies]
anyhow = "1"
ort = "=2.0.0-rc.15"
serde_json = "1"
tungstenite = "0.30"
ureq = { version = "3", features = ["json"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
