name: dashboard
services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    restart: unless-stopped
    network_mode: host
    environment:
      HOSTNAME: 127.0.0.1
      PORT: "13000"
      HOMEPAGE_ALLOWED_HOSTS: legion.<tailnet>.ts.net,127.0.0.1:13000
    volumes:
      - ./config:/app/config
