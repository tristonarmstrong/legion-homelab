# Echo cancellation for Luna (voiced): she plays through luna_ec_sink and listens on
# luna_ec_source, so her own voice is removed from the mic and can never wake her.
# Masters are the default mic and speakers. Everything else keeps using the plain devices.
pulse.cmd = [
  { cmd = "load-module" args = "module-echo-cancel aec_method=webrtc source_name=luna_ec_source sink_name=luna_ec_sink aec_args=\"webrtc.gain_control=false webrtc.experimental_agc=false webrtc.noise_suppression=false\"" flags = [ "nofail" ] }
]
